services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: citizen-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: citizen_ai
      POSTGRES_USER: citizen_ai
      POSTGRES_PASSWORD: citizen_ai_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U citizen_ai -d citizen_ai"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: